<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Plans</title>
<style>
:root { color-scheme: light; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;color:#111827;font-size:15px;line-height:1.5;max-width:480px;margin:0 auto;padding-bottom:80px;}

.header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header h1{font-size:17px;font-weight:600;}
.settings-btn{background:none;border:1px solid #e5e7eb;border-radius:8px;padding:6px 10px;font-size:13px;color:#6b7280;cursor:pointer;font-family:inherit;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(3,1fr);z-index:100;}
.nav-btn{background:none;border:none;padding:10px 4px 8px;font-size:11px;color:#9ca3af;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;}
.nav-btn.on{color:#111827;font-weight:500;}
.nav-icon{font-size:20px;line-height:1;}

.tab{display:none;padding:16px;}
.tab.on{display:block;}

/* Today tab */
.today-hero{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px;margin-bottom:16px;}
.today-date{font-size:12px;color:#9ca3af;margin-bottom:4px;}
.today-plan{font-size:18px;font-weight:600;color:#111827;}
.today-badge{display:inline-flex;align-items:center;background:#eff6ff;color:#1e40af;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:500;margin-top:6px;}
.rest-badge{background:#f0fdf4;color:#166534;}
.weekend-badge{background:#fdf2f8;color:#9d174d;}
.no-schedule{font-size:13px;color:#6b7280;margin-top:6px;}

.section-label{font-size:11px;font-weight:600;color:#9ca3af;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px;}

/* Meal cards */
.mcard{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.mcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.mname{font-size:14px;font-weight:500;color:#111827;flex:1;}
.mtiming{font-size:11px;color:#9ca3af;margin-bottom:3px;}
.copy-btn{background:none;border:1px solid #e5e7eb;border-radius:6px;padding:4px 9px;font-size:11px;color:#6b7280;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;transition:background 0.1s;}
.copy-btn:active{background:#f3f4f6;}
.copy-btn.ok{color:#065f46;border-color:#6ee7b7;background:#ecfdf5;}
.mfoods-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;}
.mfoods{font-size:12px;color:#6b7280;line-height:1.6;flex:1;}
.chips{display:flex;flex-wrap:wrap;gap:4px;}
.chip{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;}
.cp{background:#d1fae5;color:#065f46;}
.cc{background:#dbeafe;color:#1e40af;}
.cf{background:#fef3c7;color:#92400e;}
.ck{background:#f3f4f6;color:#6b7280;}

/* Totals box */
.totbox{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-top:12px;}
.tottitle{font-size:13px;font-weight:500;color:#111827;margin-bottom:2px;}
.totsub{font-size:11px;color:#9ca3af;margin-bottom:10px;}
.totgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.totcell{text-align:center;}
.totval{font-size:18px;font-weight:500;}
.totlbl{font-size:10px;color:#9ca3af;margin-top:1px;}

/* Notes */
.note{padding:9px 12px;border-radius:8px;margin:6px 0;font-size:12px;line-height:1.6;border-left:3px solid;}
.ni{background:#eff6ff;color:#1e40af;border-color:#3b82f6;}
.nw{background:#fffbeb;color:#92400e;border-color:#f59e0b;}
.ns{background:#ecfdf5;color:#065f46;border-color:#10b981;}

/* All plans tab */
.plan-picker-row{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.plan-picker-row label{font-size:13px;color:#6b7280;white-space:nowrap;}
.plan-picker-row select{flex:1;border:none;background:none;font-size:14px;font-weight:500;color:#111827;font-family:inherit;cursor:pointer;}

/* Grocery tab */
.grocery-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.grocery-cat{font-size:13px;font-weight:600;color:#111827;margin-bottom:10px;}
.grocery-row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:13px;}
.grocery-row:last-child{border-bottom:none;}
.grocery-name{color:#374151;}
.grocery-qty{font-weight:500;color:#111827;font-size:12px;text-align:right;}
.grocery-sub{font-size:12px;color:#9ca3af;margin-bottom:12px;}
.schedule-badge{display:inline-block;background:#f3f4f6;border-radius:6px;padding:2px 8px;font-size:11px;color:#6b7280;margin-bottom:12px;}

/* Schedule bottom sheet */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:flex-end;justify-content:center;}
.overlay.on{display:flex;}
.sheet{background:#fff;border-radius:16px 16px 0 0;padding:20px 16px 32px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
.sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.sheet-title{font-size:16px;font-weight:600;}
.close-x{background:#f3f4f6;border:none;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sett-label{font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
.day-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;}
.day-chip{text-align:center;padding:8px 2px;border-radius:8px;font-size:12px;border:1.5px solid #e5e7eb;cursor:pointer;background:#fff;font-family:inherit;transition:all 0.1s;}
.day-chip .d{font-weight:500;}
.day-chip .dt{font-size:10px;color:#9ca3af;margin-top:1px;}
.day-chip.tr{background:#dbeafe;border-color:#93c5fd;color:#1e40af;}
.day-chip.tr .dt{color:#93c5fd;}
.day-chip.re{background:#dcfce7;border-color:#86efac;color:#166534;}
.day-chip.re .dt{color:#86efac;}
.legend{display:flex;gap:14px;margin-bottom:20px;font-size:12px;color:#6b7280;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;}
.leg-sq{width:12px;height:12px;border-radius:3px;}
.office-note{font-size:12px;color:#9ca3af;margin-bottom:16px;line-height:1.5;}
.save-btn{width:100%;background:#111827;color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:4px;}

/* Office days toggle */
.office-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;}
.office-chip{text-align:center;padding:8px 2px;border-radius:8px;font-size:12px;border:1.5px solid #e5e7eb;cursor:pointer;background:#fff;font-family:inherit;transition:all 0.1s;}
.office-chip .d{font-weight:500;}
.office-chip .dt{font-size:10px;color:#9ca3af;margin-top:1px;}
.office-chip.off{background:#f3f4f6;border-color:#d1d5db;color:#374151;}
.office-chip.off .dt{color:#9ca3af;}
</style>
</head>
<body>

<div class="header">
  <h1>Meal Plans</h1>
  <button class="settings-btn" onclick="openSchedule()">Schedule ⚙</button>
</div>

<div id="tab-today" class="tab on">
  <div class="today-hero">
    <div class="today-date" id="today-date"></div>
    <div class="today-plan" id="today-plan-name">—</div>
    <div id="today-badge"></div>
  </div>
  <div id="today-meals"></div>
</div>

<div id="tab-all" class="tab">
  <div class="plan-picker-row">
    <label>Plan</label>
    <select id="all-plan-select" onchange="renderAllPlans()">
      <option value="training-home">Training · Home</option>
      <option value="rest-home">Rest · Home</option>
      <option value="training-office">Training · Office</option>
      <option value="rest-office">Rest · Office</option>
      <option value="weekend">Weekend</option>
    </select>
  </div>
  <div id="all-plan-meals"></div>
</div>

<div id="tab-grocery" class="tab">
  <div id="grocery-content"></div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn on" id="nav-today" onclick="setTab('today')">
    <span class="nav-icon">📅</span>Today
  </button>
  <button class="nav-btn" id="nav-all" onclick="setTab('all')">
    <span class="nav-icon">📋</span>All plans
  </button>
  <button class="nav-btn" id="nav-grocery" onclick="setTab('grocery')">
    <span class="nav-icon">🛒</span>Groceries
  </button>
</nav>

<!-- Schedule sheet -->
<div class="overlay" id="sched-overlay" onclick="if(event.target===this)closeSchedule()">
  <div class="sheet">
    <div class="sheet-header">
      <div class="sheet-title">Your weekly schedule</div>
      <button class="close-x" onclick="closeSchedule()">✕</button>
    </div>

    <div class="sett-label">Training days</div>
    <div class="legend">
      <div class="leg"><div class="leg-sq" style="background:#dbeafe;border:1.5px solid #93c5fd"></div>Training</div>
      <div class="leg"><div class="leg-sq" style="background:#dcfce7;border:1.5px solid #86efac"></div>Rest</div>
      <div class="leg"><div class="leg-sq" style="background:#fff;border:1.5px solid #e5e7eb"></div>Tap to cycle</div>
    </div>
    <div class="day-row" id="train-chips"></div>

    <div class="sett-label" style="margin-top:20px">Office days</div>
    <div class="office-note">Office days use the cafeteria-based plans with your fixed snacks (protein scoop + GoMacro bar).</div>
    <div class="office-row" id="office-chips"></div>

    <button class="save-btn" onclick="saveSchedule()">Save schedule</button>
  </div>
</div>

      { name: 'True Nutrition protein', qty: 1, unit: 'scoop', cat: 'supplements' },
      { name: 'GF rolled oats', qty: 85, unit: 'g', cat: 'grains' },
      { name: 'Mixed berries (frozen)', qty: 175, unit: 'g', cat: 'produce' },
      { name: 'Ground flaxseed', qty: 1, unit: 'tbsp', cat: 'pantry' },
    ],
  },
};

const CAT_META = {
  proteins:    { label: '🥩 Proteins',    order: 1 },
  grains:      { label: '🌾 Grains',      order: 2 },
  produce:     { label: '🥦 Produce',     order: 3 },
  pantry:      { label: '🫙 Pantry',      order: 4 },
  supplements: { label: '💊 Supplements', order: 5 },
};

// ─── STATE ──────────────────────────────────────────────────────────────────
// schedule: array[7] of plan IDs (Mon–Sun)
const defaultSchedule = ['training-office','rest-office','training-office','training-home','rest-home','weekend','weekend'];

function loadState() {
  try {
    const s = localStorage.getItem('mealplan-state');
    return s ? JSON.parse(s) : null;
  } catch(e) { return null; }
}
function saveState() {
  try { localStorage.setItem('mealplan-state', JSON.stringify(state)); } catch(e) {}
}

const saved = loadState();
const state = {
  schedule: (saved && saved.schedule) ? saved.schedule : [...defaultSchedule],
  // For schedule sheet: which days are training, which are office
  // Derived from schedule for display; set explicitly in sheet
  trainDays: saved ? saved.trainDays : [true, false, true, true, false, false, false], // Mon-Sun
  officeDays: saved ? saved.officeDays : [true, true, true, false, false, false, false],
};

// ─── HELPERS ────────────────────────────────────────────────────────────────
function fmtQty(qty, unit) {
  if (unit === 'count') return `×${Math.round(qty)}`;
  if (unit === 'cup') { const r = Math.round(qty * 4)/4; return `${r} cup${qty !== 1 ? 's' : ''}`; }
  if (unit === 'scoop') return `${Math.round(qty)} scoop${qty !== 1 ? 's' : ''}`;
  if (unit === 'tbsp') return `${Math.round(qty * 2)/2} tbsp`;
  if (unit === 'use') return 'as needed';
  if (unit === 'g') return `${Math.round(qty)}g`;
  return `${qty} ${unit}`;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyText(text, btn) {
  const do_copy = () => {
    btn.classList.add('ok');
    const orig = btn.textContent;
    btn.textContent = '✓ Copied';
    setTimeout(() => { btn.classList.remove('ok'); btn.textContent = orig; }, 1800);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(do_copy).catch(() => fallbackCopy(text, btn, do_copy));
  } else { fallbackCopy(text, btn, do_copy); }
}

function fallbackCopy(text, btn, cb) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); cb(); } catch(e) {}
  document.body.removeChild(ta);
}

function macroChips(meal) {
  if (meal.p === null) return '';
  return `<div class="chips">
    <span class="chip cp">${meal.p}g P</span>
    <span class="chip cc">${meal.c}g C</span>
    <span class="chip cf">${meal.f}g F</span>
    <span class="chip ck">${meal.kcal} kcal</span>
  </div>`;
}

function mfText(meal) {
  const macros = meal.p !== null ? `\n\nP: ${meal.p}g  C: ${meal.c}g  F: ${meal.f}g  |  ${meal.kcal} kcal` : '';
  return `${meal.name}\n${meal.foods}${macros}`;
}

function renderMealCards(meals, planId) {
  return meals.map((meal, i) => {
    const key = `${planId}-${i}`;
    const foods = esc(meal.foods).replace(/\n/g, '<br>');
    const estTag = meal.est ? '<span class="est-tag"> (estimated)</span>' : '';
    return `<div class="mcard">
      <div class="mtiming">${meal.timing}</div>
      <div class="mcard-top">
        <div class="mname">${meal.name}${estTag}</div>
        <button class="copy-btn" id="btn-mf-${key}" onclick="copyText(\`${mfText(meal).replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$')}\`, this)">Copy for MF</button>
      </div>
      <div class="mfoods-row">
        <div class="mfoods">${foods}</div>
      </div>
      ${macroChips(meal)}
    </div>`;
  }).join('');
}

function renderTotals(plan) {
  const totals = plan.meals.reduce((s,m) => ({
    p: s.p+(m.p||0), c: s.c+(m.c||0), f: s.f+(m.f||0), kcal: s.kcal+(m.kcal||0)
  }), {p:0,c:0,f:0,kcal:0});
  return `<div class="totbox">
    <div class="tottitle">Daily totals</div>
    <div class="totsub">Approximate — fine-tune in MacroFactor</div>
    <div class="totgrid">
      <div class="totcell"><div class="totval" style="color:#065f46">${totals.p}g</div><div class="totlbl">Protein</div></div>
      <div class="totcell"><div class="totval" style="color:#1e40af">${totals.c}g</div><div class="totlbl">Carbs</div></div>
      <div class="totcell"><div class="totval" style="color:#92400e">${totals.f}g</div><div class="totlbl">Fat</div></div>
      <div class="totcell"><div class="totval">${totals.kcal.toLocaleString()}</div><div class="totlbl">Calories</div></div>
    </div>
  </div>`;
}

function renderNotes(notes) {
  if (!notes || !notes.length) return '';
  return notes.map(n => `<div class="note ${n.type}">${esc(n.text)}</div>`).join('');
}

// ─── TODAY TAB ───────────────────────────────────────────────────────────────
function renderToday() {
  const today = new Date();
  const dow = (today.getDay() + 6) % 7; // 0=Mon
  const pid = state.schedule[dow];
  const plan = pid ? PLANS[pid] : null;

  document.getElementById('today-date').textContent =
    today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  document.getElementById('today-plan-name').textContent = plan ? plan.label : 'No plan assigned';

  const badgeEl = document.getElementById('today-badge');
  if (plan) {
    const cls = plan.category === 'rest' ? 'rest-badge' : plan.category === 'weekend' ? 'weekend-badge' : '';
    const tgt = `Target: ${plan.targets.p}g P · ${plan.targets.c}g C · ${plan.targets.f}g F · ~${plan.targets.kcal.toLocaleString()} kcal`;
    badgeEl.innerHTML = `<span class="today-badge ${cls}">${tgt}</span>`;
  } else {
    badgeEl.innerHTML = `<span class="no-schedule">Set your schedule using the Schedule button above.</span>`;
  }

  const meals = document.getElementById('today-meals');
  if (!plan) { meals.innerHTML = ''; return; }
  meals.innerHTML =
    renderMealCards(plan.meals, `today-${pid}`) +
    renderNotes(plan.notes) +
    renderTotals(plan);
}

// ─── ALL PLANS TAB ───────────────────────────────────────────────────────────
function renderAllPlans() {
  const pid = document.getElementById('all-plan-select').value;
  const plan = PLANS[pid];
  document.getElementById('all-plan-meals').innerHTML =
    renderMealCards(plan.meals, `all-${pid}`) +
    renderNotes(plan.notes) +
    renderTotals(plan);
}

// ─── GROCERY TAB ────────────────────────────────────────────────────────────
function computeGrocery() {
  const map = {};
  state.schedule.forEach(pid => {
    if (!pid) return;
    PLANS[pid].ingredients.forEach(ing => {
      const key = `${ing.cat}||${ing.name}||${ing.unit}`;
      if (!map[key]) map[key] = { name: ing.name, qty: 0, unit: ing.unit, cat: ing.cat };
      map[key].qty += ing.qty;
    });
  });
  return Object.values(map);
}

function renderGrocery() {
  const items = computeGrocery();
  const planSummary = [...new Set(state.schedule.filter(Boolean))].map(pid => PLANS[pid].short).join(' · ');
  const grouped = {};
  items.forEach(i => { if (!grouped[i.cat]) grouped[i.cat] = []; grouped[i.cat].push(i); });
  const sortedCats = Object.keys(grouped).sort((a,b) => CAT_META[a].order - CAT_META[b].order);

  let html = `<div class="grocery-sub">Auto-generated from your weekly schedule</div>
    <div class="schedule-badge">${planSummary}</div>`;

  sortedCats.forEach(cat => {
    html += `<div class="grocery-card"><div class="grocery-cat">${CAT_META[cat].label}</div>`;
    grouped[cat].forEach(item => {
      html += `<div class="grocery-row">
        <span class="grocery-name">${item.name}</span>
        <span class="grocery-qty">${fmtQty(item.qty, item.unit)}</span>
      </div>`;
    });
    html += `</div>`;
  });

  document.getElementById('grocery-content').innerHTML = html;
}

// ─── TABS ────────────────────────────────────────────────────────────────────
function setTab(name) {
  ['today','all','grocery'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('on', t === name);
    document.getElementById('nav-'+t).classList.toggle('on', t === name);
  });
  if (name === 'all') renderAllPlans();
  if (name === 'grocery') renderGrocery();
}

// ─── SCHEDULE SHEET ─────────────────────────────────────────────────────────
// Temporary state for sheet (committed on Save)
let sheetTrain = [];
let sheetOffice = [];

function openSchedule() {
  sheetTrain = [...state.trainDays];
  sheetOffice = [...state.officeDays];
  renderSheetChips();
  document.getElementById('sched-overlay').classList.add('on');
}

function closeSchedule() {
  document.getElementById('sched-overlay').classList.remove('on');
}

function renderSheetChips() {
  const today = new Date();
  const todayDow = (today.getDay() + 6) % 7;

  // Training chips
  let tHtml = '';
  const weekDates = getWeekDates();
  DAYS_SHORT.forEach((d, i) => {
    const cls = sheetTrain[i] ? 'tr' : 're';
    const label = sheetTrain[i] ? 'Train' : 'Rest';
    tHtml += `<button class="day-chip ${cls}" onclick="toggleTrain(${i})">
      <div class="d">${d}</div>
      <div class="dt">${label}</div>
    </button>`;
  });
  document.getElementById('train-chips').innerHTML = tHtml;

  // Office chips
  let oHtml = '';
  DAYS_SHORT.forEach((d, i) => {
    const cls = sheetOffice[i] ? 'off' : '';
    const label = sheetOffice[i] ? 'Office' : 'Home';
    oHtml += `<button class="office-chip ${cls}" onclick="toggleOffice(${i})">
      <div class="d">${d}</div>
      <div class="dt">${label}</div>
    </button>`;
  });
  document.getElementById('office-chips').innerHTML = oHtml;
}

function getWeekDates() {
  const today = new Date();
  const dow = (today.getDay() + 6) % 7;
  const monday = new Date(today);
  monday.setDate(today.getDate() - dow);
  return Array.from({length:7}, (_,i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

function toggleTrain(i) {
  sheetTrain[i] = !sheetTrain[i];
  renderSheetChips();
}

function toggleOffice(i) {
  sheetOffice[i] = !sheetOffice[i];
  renderSheetChips();
}

function saveSchedule() {
  state.trainDays = [...sheetTrain];
  state.officeDays = [...sheetOffice];
  // Derive schedule from train/office combos
  state.schedule = DAYS_SHORT.map((_, i) => {
    const isTrain = state.trainDays[i];
    const isOffice = state.officeDays[i];
    if (isTrain && isOffice) return 'training-office';
    if (isTrain && !isOffice) return 'training-home';
    if (!isTrain && isOffice) return 'rest-office';
    // Weekend days (Sat=5, Sun=6) that are not training default to weekend
    if (i >= 5) return 'weekend';
    return 'rest-home';
  });
  saveState();
  closeSchedule();
  renderToday();
  renderGrocery();
}

// ─── INIT ────────────────────────────────────────────────────────────────────
renderToday();
</script>
