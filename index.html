var DEFAULT_TRAIN=[1,2,4,6];
var DEFAULT_OFFICE=[1,2,3];

function loadSchedule(){
  try{
    var t=JSON.parse(localStorage.getItem('trainDays')||'null');
    var o=JSON.parse(localStorage.getItem('officeDays')||'null');
    return{train:t||DEFAULT_TRAIN,office:o||DEFAULT_OFFICE};
  }catch(e){return{train:DEFAULT_TRAIN,office:DEFAULT_OFFICE};}
}
function saveSchedule(t,o){
  try{localStorage.setItem('trainDays',JSON.stringify(t));localStorage.setItem('officeDays',JSON.stringify(o));}catch(e){}
}

var schedule=loadSchedule();

function getPlanKey(dayIdx){
  var isTrain=schedule.train.indexOf(dayIdx)>=0;
  var isOffice=schedule.office.indexOf(dayIdx)>=0;
  if(isTrain&&isOffice)return'training-office';
  if(isTrain)return'training-home';
  if(isOffice)return'rest-office';
  return'rest-home';
}

function renderMeals(plan){
  if(!plan.meals){
    var h='<p style="font-size:14px;font-weight:500;margin:0 0 6px;color:#111827">Weekend eating-out guidelines</p>';
    h+='<p style="font-size:12px;color:#9ca3af;margin:0 0 14px;line-height:1.6">No fixed plan — use these guidelines when eating out with friends.</p>';
    plan.notes.forEach(function(n){h+='<div class="note '+n.c+'">'+n.h+'</div>';});
    return h;
  }
  var h='<div class="note ni" style="margin-bottom:14px;font-size:12px">Target: '+plan.target+'</div>';
  plan.meals.forEach(function(m){
    h+='<div class="section-label">'+m.slot+'</div>';
    h+='<div class="mcard">';
    h+='<div class="mcard-top"><span class="mname">'+m.name+(m.est?' <span class="est">(estimated)</span>':'')+'</span>';
    h+='<button class="copy-btn mf" data-copy="'+encodeURIComponent(m.copy)+'" title="Copy MacroFactor-formatted description">MF</button></div>';
    h+='<div class="mfoods-row"><p class="mfoods">'+m.foods+'</p>';
    h+='<button class="copy-btn" data-copy="'+encodeURIComponent(m.foods)+'" title="Copy ingredients">Copy</button></div>';
    h+='<div class="chips"><span class="chip cp">'+m.p+'g P</span><span class="chip cc">'+m.c+'g C</span><span class="chip cf">'+m.f+'g F</span><span class="chip ck">'+m.k+' kcal</span></div>';
    h+='</div>';
  });
  if(plan.tot){
    var t=plan.tot;
    h+='<div class="totbox"><p class="tottitle">Daily totals</p><p class="totsub">'+(plan.totNote||'Approximate — fine-tune in MacroFactor')+'</p>';
    h+='<div class="totgrid">';
    h+='<div class="totcell"><div class="totval" style="color:#065f46">'+t.p+'g</div><div class="totlbl">Protein</div></div>';
    h+='<div class="totcell"><div class="totval" style="color:#1e40af">'+t.c+'g</div><div class="totlbl">Carbs</div></div>';
    h+='<div class="totcell"><div class="totval" style="color:#92400e">'+t.f+'g</div><div class="totlbl">Fat</div></div>';
    h+='<div class="totcell"><div class="totval" style="color:#374151">'+t.k.toLocaleString()+'</div><div class="totlbl">Calories</div></div>';
    h+='</div></div>';
  }
  if(plan.notes&&plan.notes.length){
    h+='<div style="margin-top:12px">';
    plan.notes.forEach(function(n){h+='<div class="note '+n.c+'">'+n.h+'</div>';});
    h+='</div>';
  }
  return h;
}

function attachCopyButtons(container){
  container.querySelectorAll('.copy-btn').forEach(function(btn){
    var orig=btn.textContent;
    btn.addEventListener('click',function(){
      var text=decodeURIComponent(btn.getAttribute('data-copy'));
      navigator.clipboard.writeText(text).then(function(){
        btn.textContent='✓';
        btn.classList.add('ok');
        setTimeout(function(){btn.textContent=orig;btn.classList.remove('ok');},2000);
      }).catch(function(){
        btn.textContent='✓';
        setTimeout(function(){btn.textContent=orig;},1500);
      });
    });
  });
}

function renderToday(){
  var el=document.getElementById('tab-today');
  var today=new Date();
  var dayIdx=today.getDay();
  var dateStr=today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  var planKey=getPlanKey(dayIdx);
  var plan=PLANS[planKey];
  var isConfigured=true;

  var heroHtml='<div class="today-hero">';
  heroHtml+='<div class="today-date">'+dateStr+'</div>';
  heroHtml+='<div class="today-plan">'+plan.label+'</div>';
  if(!isConfigured){
    heroHtml+='<p class="no-schedule">Set your schedule above to auto-detect today\'s plan.</p>';
  } else {
    var badgeCls=plan.isTraining?'today-badge':'today-badge rest-badge';
    heroHtml+='<span class="'+badgeCls+'">'+(plan.isTraining?'Training day':'Rest day')+'</span>';
  }
  heroHtml+='</div>';

  el.innerHTML=heroHtml+renderMeals(plan);
  attachCopyButtons(el);
}

function renderBrowse(selectedKey){
  var el=document.getElementById('tab-browse');
  var keys=['training-home','rest-home','training-office','rest-office','weekend'];
  var labels=['Training / home','Rest / home','Training / office','Rest / office','Weekend'];
  var opts=keys.map(function(k,i){
    return'<option value="'+k+'"'+(k===selectedKey?' selected':'')+'>'+labels[i]+'</option>';
  }).join('');
  var pickerHtml='<div class="plan-picker"><label>Viewing:</label><select id="planSelect">'+opts+'</select></div>';
  el.innerHTML=pickerHtml+renderMeals(PLANS[selectedKey]);
  attachCopyButtons(el);
  el.querySelector('#planSelect').addEventListener('change',function(){
    renderBrowse(this.value);
  });
}

function renderGroceries(){
  var el=document.getElementById('tab-groceries');
  var planCounts={'training-home':0,'rest-home':0,'training-office':0,'rest-office':0};
  for(var d=0;d<7;d++){
    var k=getPlanKey(d);
    if(planCounts[k]!==undefined)planCounts[k]++;
  }

  var countParts=[];
  if(planCounts['training-home']>0)countParts.push(planCounts['training-home']+'× training/home');
  if(planCounts['training-office']>0)countParts.push(planCounts['training-office']+'× training/office');
  if(planCounts['rest-home']>0)countParts.push(planCounts['rest-home']+'× rest/home');
  if(planCounts['rest-office']>0)countParts.push(planCounts['rest-office']+'× rest/office');

  var totals={};
  var units={};
  Object.keys(planCounts).forEach(function(planKey){
    var count=planCounts[planKey];
    if(count===0||!GROCERY[planKey])return;
    Object.keys(GROCERY[planKey]).forEach(function(item){
      var d=GROCERY[planKey][item];
      if(!totals[item]){totals[item]=0;units[item]=d.u;}
      totals[item]+=d.a*count;
    });
  });

  var schedBadge='<div class="schedule-badge">Your week: '+countParts.join(' · ')+'</div>';
  var subHtml='<p class="grocery-sub">Weekly quantities based on your current schedule. Does not include weekend eating-out meals.</p>';

  var cardsHtml='';
  GROCERY_CATS.forEach(function(cat){
    var rows='';
    cat.items.forEach(function(item){
      if(!totals[item])return;
      var qty=totals[item];
      var unit=units[item]||'';
      var display=Math.round(qty*10)/10;
      var qtyStr;
      if(unit==='scoops'){qtyStr=display+' scoops';}
      else if(unit==='ml-bev'){
        var flozB=Math.round(qty/29.574*10)/10;
        var cupsB=Math.round(qty/240*10)/10;
        qtyStr=flozB+' fl oz ('+cupsB+' cup'+(cupsB===1?'':'s')+') per day';
      }
      else if(unit==='ml'&&item.indexOf('egg')>=0){
        var floz=Math.round(qty/29.574*10)/10;
        var cups=Math.round(qty/240*4)/4;
        qtyStr=floz+' fl oz ('+cups+' cups)';
      }
      else if(unit==='ml'){
        var tbsp=Math.round(qty/14.787);
        var floz2=Math.round(qty/29.574*10)/10;
        qtyStr=tbsp+' tbsp (~'+floz2+' fl oz)';
      }
      else if(unit==='g'){
        var gRound=Math.round(qty);
        var imperial;
        if(qty>=454){var lbs=Math.round(qty/453.592*10)/10;imperial='~'+lbs+' lb';}
        else{var oz=Math.round(qty/28.3495*10)/10;imperial='~'+oz+' oz';}
        qtyStr=gRound+'g ('+imperial+')';
      }
      else if(unit==='bar'){qtyStr=display+(display===1?' bar':' bars');}
      else{qtyStr=display+(unit?' '+unit:'');}
      rows+='<div class="grocery-row"><span class="grocery-name">'+item+'</span><span class="grocery-qty">'+qtyStr+'</span></div>';
    });
    if(rows){
      cardsHtml+='<div class="grocery-card"><div class="grocery-cat">'+cat.label+'</div>'+rows+'</div>';
    }
  });

  el.innerHTML=schedBadge+subHtml+cardsHtml;
}

function switchTab(name,btn){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('on');});
  document.getElementById('tab-'+name).classList.add('on');
  btn.classList.add('on');
  if(name==='browse'){var k=document.getElementById('tab-browse').querySelector('#planSelect');if(!k)renderBrowse('training-home');}
  if(name==='groceries')renderGroceries();
}

function renderSettingsSheet(){
  var trainRow=document.getElementById('trainDayRow');
  var officeRow=document.getElementById('officeDayRow');
  trainRow.innerHTML='';
  officeRow.innerHTML='';
  DAYS.forEach(function(day,i){
    var isTrain=schedule.train.indexOf(i)>=0;
    var tc=document.createElement('button');
    tc.className='day-chip'+(isTrain?' tr':'');
    tc.innerHTML='<div class="d">'+day[0]+'</div><div class="dt">'+(isTrain?'Train':'Rest')+'</div>';
    tc.onclick=function(){
      var idx=schedule.train.indexOf(i);
      if(idx>=0)schedule.train.splice(idx,1);else schedule.train.push(i);
      renderSettingsSheet();
    };
    trainRow.appendChild(tc);

    var isOff=schedule.office.indexOf(i)>=0;
    var oc=document.createElement('button');
    oc.className='off-chip'+(isOff?' off':'');
    oc.innerHTML='<div class="d">'+day[0]+'</div><div class="dt">'+(isOff?'Office':'Home')+'</div>';
    oc.onclick=function(){
      var idx=schedule.office.indexOf(i);
      if(idx>=0)schedule.office.splice(idx,1);else schedule.office.push(i);
      renderSettingsSheet();
    };
    officeRow.appendChild(oc);
  });
}

document.getElementById('openSettings').addEventListener('click',function(){
  renderSettingsSheet();
  document.getElementById('settingsOverlay').classList.add('on');
});
document.getElementById('closeSettings').addEventListener('click',function(){
  document.getElementById('settingsOverlay').classList.remove('on');
});
document.getElementById('settingsOverlay').addEventListener('click',function(e){
  if(e.target===this)this.classList.remove('on');
});
document.getElementById('saveSettings').addEventListener('click',function(){
  saveSchedule(schedule.train,schedule.office);
  document.getElementById('settingsOverlay').classList.remove('on');
  renderToday();
  renderGroceries();
});

renderToday();
